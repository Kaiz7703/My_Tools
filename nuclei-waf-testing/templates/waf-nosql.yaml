id: waf-nosql-testing
info:
  name: WAF Efficacy Testing - NoSQL Injection
  author: your-name
  severity: info
  description: Testing WAF resilience against NoSQL injection payloads specifically targeting URL query strings, application/x-www-form-urlencoded boundaries, and application/json bodies.
  tags: waf-test, nosql, fuzzing

variables:
  payload_list: ../payloads/nosql.txt

http:
  - raw:
      # Kiểu 1: Gài NoSQL Payload qua Query Parameters (Cổ điển)
      - |+
        GET /search?q={{payloads}}&id={{payloads}} HTTP/1.1
        Host: {{Hostname}}
        Accept: application/json

      # Kiểu 2: Bypass WAF qua HTTP Headers (đập thẳng vào NodeJS Logging Backend)
      - |+
        GET / HTTP/1.1
        Host: {{Hostname}}
        User-Agent: {{payloads}}
        X-Forwarded-For: {{payloads}}

      # Kiểu 3: Đâm Form x-www-form-urlencoded
      - |+
        POST /login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        
        username=admin&password={{payloads}}

      # Kiểu 4: Sát thủ của NoSQL - JSON Body đục khoét (GraphQL/ExpressJS)
      - |+
        POST /api/v1/auth HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json
        
        {"username": "admin", "password": "{{payloads}}"}

    payloads:
      payloads:
        - "{{payload_list}}" # Load danh sách nosql.txt đã được lọc trùng

    # mode 'batteringram' giúp chèn payload vào hàng loạt vị trí {{payloads}} trên từng Request
    attack: batteringram

    unsafe: true
    matchers:
      - type: word
        part: header
        words:
          - "HTTP/"

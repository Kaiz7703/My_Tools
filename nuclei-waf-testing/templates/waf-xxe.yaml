id: waf-xxe-testing
info:
  name: WAF Efficacy Testing - XML External Entity (XXE)
  author: your-name
  severity: info
  description: Testing WAF resilience against XXE payloads across various XML structures and Content-Types.
  tags: waf-test, xxe, fuzzing, xml

variables:
  # Trỏ thẳng đến kho đạn XXE của bạn
  payload_list: ../payloads/xxe.txt

http:
  - raw:
      # Kiểu 1: Gửi thẳng XML Payload dạng chuẩn (Application/XML)
      - |+
        POST /api/xml-endpoint HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/xml
        Accept: application/xml

        {{payloads}}

      # Kiểu 2: Bypass WAF bằng cách nhúng XML vào JSON Body (Nhiều WAF quên parse XXE trong JSON)
      - |+
        POST /api/json-endpoint HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json
        Accept: application/json

        {"xml_data": "{{payloads}}"}

      # Kiểu 3: Bypass qua SOAP Parser (Lỗi kinh điển của các WAF cũ)
      - |+
        POST /ws/soap HTTP/1.1
        Host: {{Hostname}}
        Content-Type: text/xml; charset=utf-8
        SOAPAction: "http://example.com/action"

        <?xml version="1.0" encoding="utf-8"?>
        <soap:Envelope xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">
          <soap:Body>
            <ValidateData xmlns="http://example.com/">
              <xmlString><![CDATA[{{payloads}}]]></xmlString>
            </ValidateData>
          </soap:Body>
        </soap:Envelope>

      # Kiểu 4: Lẻn XXE qua Form Upload Dữ liệu (multipart/form-data)
      - |+
        POST /upload HTTP/1.1
        Host: {{Hostname}}
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundary7MA4YWxkTrZu0gW
        
        ------WebKitFormBoundary7MA4YWxkTrZu0gW
        Content-Disposition: form-data; name="file"; filename="payload.xml"
        Content-Type: text/xml

        {{payloads}}
        ------WebKitFormBoundary7MA4YWxkTrZu0gW--

    payloads:
      payloads:
        - "{{payload_list}}" # Load danh mục từ file xxe.txt

    # Gửi từng payload XXE một lên tất cả các Request định nghĩa phía trên
    # (Do đặc thù XXE phá hỏng cấu trúc XML nên dùng mode cluster)
    attack: batteringram

    # Dummy Matcher: Nhận diện mọi phản hồi để Nuclei Output thành JSON file 
    matchers:
      - type: word
        part: header
        words:
          - "HTTP/"

id: waf-log4shell-testing
info:
  name: WAF Efficacy Testing - Log4Shell (CVE-2021-44228)
  author: your-name
  severity: info
  description: Testing WAF capabilities against Log4j JNDI injection payloads. Fuzzing various Headers that are commonly logged by backend Java applications.
  tags: waf-test, log4shell, jndi, fuzzing, java

variables:
  payload_list: D:\dowload\Payload\nuclei-waf-testing\payloads\log4shell.txt

http:
  - raw:
      # Kiểu 1: Fuzz qua loạt Header thường bị Log bởi thư viện Log4j
      - |+
        GET / HTTP/1.1
        Host: {{Hostname}}
        User-Agent: {{payloads}}
        X-Forwarded-For: {{payloads}}
        X-Api-Version: {{payloads}}
        Referer: {{payloads}}
        Authentication: Bearer {{payloads}}

      # Kiểu 2: URL Path và Query parameters
      - |+
        GET /api/v1/{{payloads}}?query={{payloads}} HTTP/1.1
        Host: {{Hostname}}
        Accept: application/json

    payloads:
      payloads:
        - "{{payload_list}}"

    attack: batteringram

    matchers:
      - type: word
        part: header
        words:
          - "HTTP/"
